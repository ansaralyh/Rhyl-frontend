<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <title>Checkout - Rhyl Super Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 text-slate-900" x-data="checkoutPage()" x-init="init()">
    <!-- Header -->
    <header class="relative z-50 bg-white border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 md:h-24 gap-2 md:gap-8">
                <a href="store.html"
                    class="flex items-center gap-2 text-slate-600 hover:text-slate-900 transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    <span class="font-bold">Back to Shop</span>
                </a>
                <a href="store.html" class="flex items-center gap-1 md:gap-2 flex-shrink-0 group">
                    <img src="images/rhyll-logo.png" alt="Rhyl Super Store" class="h-10 md:h-16 w-auto object-contain"
                        style="border-radius: 1000px; filter: grayscale(100%) sepia(100%) hue-rotate(190deg) saturate(500%) contrast(120%);">
                    <div class="flex flex-col">
                        <span
                            class="text-base md:text-xl font-black text-red-600 tracking-tight leading-none">Super</span>
                        <span
                            class="text-[10px] md:text-sm font-bold text-red-600 tracking-widest uppercase leading-none">Store</span>
                    </div>
                </a>
                <a href="index.html#cart" class="relative p-2 text-slate-600 hover:text-blue-600 transition-colors">
                    <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                    <span x-show="cart.length > 0" x-text="cart.length"
                        class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-black rounded-full w-5 h-5 flex items-center justify-center"></span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
        <!-- Empty cart -->
        <div x-show="cart.length === 0 && !orderPlaced" x-cloak class="text-center py-16">
            <div
                class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-400">
                <i data-lucide="shopping-cart" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Your cart is empty</h2>
            <p class="text-slate-600 mb-6">Add items from the store to checkout.</p>
            <a href="store.html"
                class="inline-block bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-700 transition-colors">
                Continue Shopping
            </a>
        </div>

        <!-- Success message -->
        <div x-show="orderPlaced" x-cloak x-transition
            class="bg-green-50 border border-green-200 rounded-3xl p-8 text-center max-w-2xl mx-auto shadow-sm">
            <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-white">
                <i data-lucide="check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Order placed successfully</h2>
            <p class="text-slate-600 mb-6">Thank you for your order. We'll deliver it soon.</p>
            <a href="store.html"
                class="inline-block bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-700 transition-colors">
                Continue Shopping
            </a>
        </div>

        <!-- Checkout flow: step 1 = review, step 2 = delivery -->
        <template x-if="cart.length > 0 && !orderPlaced">
            <div class="space-y-8">
                <!-- Step indicator -->
                <div class="flex items-center justify-center gap-4 text-sm font-bold">
                    <span class="flex items-center gap-2">
                        <span class="w-8 h-8 rounded-full flex items-center justify-center"
                            :class="step === 1 ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'">1</span>
                        Order summary
                    </span>
                    <span class="text-slate-300">→</span>
                    <span class="flex items-center gap-2">
                        <span class="w-8 h-8 rounded-full flex items-center justify-center"
                            :class="step === 2 ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'">2</span>
                        Delivery & place order
                    </span>
                </div>

                <!-- Step 1: Order summary -->
                <div x-show="step === 1" x-cloak
                    class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-100">
                        <h1 class="text-2xl font-black text-slate-900">Order summary</h1>
                        <p class="text-slate-500 mt-1" x-text="cart.length + ' item(s)'"></p>
                    </div>
                    <div class="p-6 space-y-4 max-h-96 overflow-y-auto">
                        <template x-for="item in cart" :key="item._id + '-' + item.quantity">
                            <div class="flex gap-4 py-4 border-b border-slate-50 last:border-0">
                                <div
                                    class="w-20 h-20 bg-slate-50 rounded-2xl p-2 shrink-0 flex items-center justify-center">
                                    <img :src="item.image || 'images/placeholder.jpg'" :alt="item.name"
                                        class="max-w-full max-h-full object-contain">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-slate-900 truncate" x-text="item.name"></h3>
                                    <p class="text-slate-500 text-sm">Qty: <span x-text="item.quantity"></span></p>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="font-black text-blue-600"
                                        x-text="'£' + (item.price * item.quantity).toFixed(2)"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-6 border-t border-slate-100 space-y-2">
                        <div class="flex justify-between text-slate-600">
                            <span>Subtotal</span>
                            <span class="font-bold" x-text="'£' + cartSubtotal().toFixed(2)"></span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>Delivery</span>
                            <span class="text-green-600 font-bold">FREE</span>
                        </div>
                        <div
                            class="flex justify-between text-xl font-black text-slate-900 pt-2 border-t border-slate-100">
                            <span>Total</span>
                            <span x-text="'£' + cartSubtotal().toFixed(2)"></span>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button @click="step = 2"
                            class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-blue-600 transition-all shadow-xl active:scale-[0.98]">
                            Continue to delivery
                        </button>
                    </div>
                </div>

                <!-- Step 2: Delivery & place order -->
                <div x-show="step === 2" x-cloak
                    class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-100">
                        <h1 class="text-2xl font-black text-slate-900">Delivery details</h1>
                        <p class="text-slate-500 mt-1">Enter your details to complete the order.</p>
                    </div>
                    <form @submit.prevent="placeOrder()" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Full name</label>
                            <input type="text" x-model="form.name" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                placeholder="Your name">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Email</label>
                            <input type="email" x-model="form.email" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                placeholder="your@email.com">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Phone</label>
                            <input type="tel" x-model="form.phone" required
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                placeholder="Phone number">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">Delivery address</label>
                            <textarea x-model="form.address" required rows="3"
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                                placeholder="Street, city, postcode"></textarea>
                        </div>
                        <div class="flex gap-4 pt-4">
                            <button type="button" @click="step = 1"
                                class="flex-1 py-4 rounded-2xl font-bold border-2 border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50 transition-colors">
                                Back
                            </button>
                            <button type="submit" :disabled="placing"
                                class="flex-1 py-4 rounded-2xl font-black bg-slate-900 text-white hover:bg-blue-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                                <span x-text="placing ? 'Placing order...' : 'Place order'"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </template>

    </main>

    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
        function checkoutPage() {
            return {
                cart: [],
                step: 1,
                form: { name: '', email: '', phone: '', address: '' },
                placing: false,
                orderPlaced: false,

                async init() {
                    const saved = localStorage.getItem('cart');
                    this.cart = saved ? JSON.parse(saved) : [];

                    // Simple Auth Check
                    const token = window.getToken ? window.getToken() : localStorage.getItem('token');
                    if (!token) {
                        if (window.showToast) window.showToast('Please login to complete your order.', 'error');
                        setTimeout(function () { window.location.href = 'login.html'; }, 1200);
                        return;
                    }

                    // Pre-fill form from user data if available (Optional, removed to avoid confusion with Admin testing)
                    /*
                    const user = window.getCurrentUser ? window.getCurrentUser() : JSON.parse(localStorage.getItem('user') || '{}');
                    if (user && user.name) {
                        this.form.name = user.name;
                        this.form.email = user.email;
                    }
                    */


                    setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 100);
                },

                cartSubtotal() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },

                async placeOrder() {
                    this.placing = true;
                    try {
                        // Map cart to backend expected format
                        const orderItems = this.cart.map(item => ({
                            product: item._id,
                            quantity: item.quantity,
                            price: item.price
                        }));

                        const orderData = {
                            items: orderItems,
                            shippingAddress: this.form.address,
                            paymentMethod: 'Cash on Delivery', // Default for now
                            customerName: this.form.name,
                            customerEmail: this.form.email,
                            customerPhone: this.form.phone
                        };


                        const response = await window.api.orders.create(orderData);

                        if (response.success) {
                            this.orderPlaced = true;
                            localStorage.setItem('cart', '[]');
                            this.cart = [];
                            if (window.showToast) window.showToast('Order placed successfully!', 'success');
                            if (window.lucide) lucide.createIcons();
                        } else {
                            if (window.showToast) window.showToast(response.message || 'Error placing order', 'error');
                        }
                    } catch (err) {
                        console.error('Order Error:', err);
                        if (window.showToast) window.showToast(err.message || 'Server error occurred while placing order.', 'error');
                    } finally {
                        this.placing = false;
                    }
                }
            };
        }
    </script>

</body>

</html>
